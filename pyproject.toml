[tool.poetry]
name = "openahi"
version = "0.1.0"
description = "OpenAHI Composter 1.00.0 - small local transformer model"
authors = ["ZoDev <zodev@example.com>"]

[tool.poetry.dependencies]
python = ">=3.8"
torch = "^2.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
openahi = "openahi.cli:main"
pkg = "openahi.pkg_cli:main"
