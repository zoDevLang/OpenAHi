[package]
name = "openahi-cli"
version = "0.1.0"
edition = "2021"
authors = ["ZoDev"]
description = "OpenAHI CLI - Command-line interface for OpenAHI"
license = "Apache-2.0"
readme = "README.md"
keywords = ["openahi", "ai", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }

# Local dependencies
openahi-runtime = { path = "../runtime" }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[features]
default = []

[[bin]]
name = "openahi"
path = "src/main.rs"

[lib]
name = "openahi_cli"
path = "src/lib.rs"
