[workspace]
members = [
    "runtime",
    "backend",
    "cli",
    "pkg",
    "sdk",
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
directories = "4.0"
pathdiff = "0.2"
url = "2.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"

# Python interop
pyo3 = { version = "0.20", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
