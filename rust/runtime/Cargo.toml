[package]
name = "openahi-runtime"
version = "0.1.0"
edition = "2021"
authors = ["ZoDev"]
description = "OpenAHI Runtime - Model loading and inference orchestration"
license = "Apache-2.0"
readme = "README.md"
keywords = ["openahi", "ai", "inference", "runtime"]
categories = ["science", "algorithms"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
directories = { workspace = true }

# For model loading
byteorder = "1.5"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
# Enable Python bindings
pyo3 = ["dep:pyo3"]

[dependencies.pyo3]
optional = true
workspace = true

[[bin]]
name = "openahi-runtime"
path = "src/main.rs"

[lib]
name = "openahi_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
